<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千星奇域关卡数据提取</title>

</head>
<body class="bg-gradient-to-br from-[#f5f7fa] to-[#c3cfe2] dark:from-gray-900 dark:to-gray-800 min-h-screen pb-16 font-sans text-gray-800 dark:text-gray-200 antialiased transition-colors duration-300">

<div class="max-w-[1150px] mx-auto pt-10 px-4">
    <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md rounded-2xl shadow-[0_8px_32px_0_rgba(31,38,135,0.1)] dark:shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] border border-white/40 dark:border-gray-700/50 p-8 mb-6 transition-colors duration-300">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2 m-0 transition-colors">
                <i class="fa-solid fa-star text-yellow-500"></i> 千星奇域关卡数据提取
            </h3>
            <div class="flex items-center gap-3">
                <span id="currentProfileDisplay" class="text-sm text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 px-3 py-1.5 rounded-full flex items-center gap-2 transition-colors">

                <button onclick="toggleModal('saveManagerModal')" class="text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-1.5 rounded-full flex items-center gap-2 transition-colors shadow-sm">

            </div>

        <div class="mb-5">
            <label for="dataInput" class="block text-sm font-medium text-gray-500 dark:text-gray-400 mb-2 transition-colors">请输入列表 (格式: ID 或 ID:备注，一行一个)</label>
            <textarea id="dataInput" rows="5" class="w-full border-2 border-gray-200 dark:border-gray-600 rounded-xl p-3 font-mono text-sm focus:outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-1 focus:ring-blue-500 dark:focus:ring-blue-400 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors"></textarea>
        </div>

        <div class="flex flex-col sm:flex-row justify-end items-center gap-4">
            <label class="flex items-center cursor-pointer gap-2" title="勾选后忽略缓存，直接从服务器获取最新数据">
                <div class="relative">
                    <input type="checkbox" id="forceRefresh" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 dark:bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 dark:after:border-gray-500 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                </div>
                <span class="text-sm text-gray-500 dark:text-gray-400 select-none transition-colors">强制刷新</span>
            </label>

            <button type="button" id="btnStart" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-full flex items-center gap-2 transition-colors shadow-md disabled:opacity-70 disabled:cursor-not-allowed">
                <i class="fa-solid fa-magnifying-glass"></i> 开始提取 
                <svg id="spinner" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>
    </div>

    <div id="captureArea" class="bg-white dark:bg-gray-800 rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.05)] dark:shadow-[0_4px_12px_rgba(0,0,0,0.3)] mt-5 p-8 hidden transition-colors duration-300">
        <div class="flex justify-between items-end border-b-2 border-gray-100 dark:border-gray-700 pb-4 mb-5 transition-colors">
            <div class="flex items-center w-1/2">
                <img src="./nahida.png" class="w-12 h-12 object-contain mr-4 shrink-0" alt="icon" crossorigin="anonymous">
                <div class="text-[26px] font-extrabold text-gray-800 dark:text-gray-100 border-b border-transparent hover:border-gray-300 dark:hover:border-gray-600 focus:border-gray-300 dark:focus:border-gray-600 outline-none w-full py-0.5 cursor-text leading-snug transition-colors" contenteditable="true" spellcheck="false">关卡统计列表</div>
            </div>
            
            <div class="flex flex-col items-end gap-2.5">
                <div class="inline-flex rounded-md shadow-sm hidden" role="group" id="sortControl">
                    <label class="cursor-pointer">
                        <input type="radio" name="sortMode" id="sortOriginal" value="original" class="peer sr-only" checked>
                        <span class="px-3 py-1.5 text-xs font-medium border border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-500 rounded-l-md peer-checked:bg-blue-600 peer-checked:text-white dark:peer-checked:bg-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors flex items-center gap-1.5"><i class="fa-solid fa-list-ol"></i> 原始排序</span>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="sortMode" id="sortPlayers" value="players" class="peer sr-only">
                        <span class="px-3 py-1.5 text-xs font-medium border border-l-0 border-blue-600 text-blue-600 dark:text-blue-400 dark:border-blue-500 rounded-r-md peer-checked:bg-blue-600 peer-checked:text-white dark:peer-checked:bg-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors flex items-center gap-1.5"><i class="fa-solid fa-arrow-down-short-wide"></i> 人数排序</span>
                    </label>
                </div>

                <div class="text-right text-sm text-gray-400 dark:text-gray-500 leading-relaxed min-w-[150px] transition-colors">
                    <div>生成时间: <strong id="genTime" class="text-gray-600 dark:text-gray-300 font-medium">-</strong></div>
                    <div>项目数量: <strong id="countBadge" class="text-gray-600 dark:text-gray-300 font-medium">0</strong></div>
                </div>
            </div>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse" id="resultTable">
                <thead>
                    <tr class="bg-gray-50 dark:bg-gray-700/50 text-gray-600 dark:text-gray-300 text-sm border-b-2 border-gray-200 dark:border-gray-700 transition-colors">

                        <th class="py-3 px-3 font-bold w-[150px] whitespace-nowrap">作者</th>
                        <th class="py-3 px-3 font-bold whitespace-nowrap">关卡信息</th>
                        <th class="py-3 px-3 font-bold w-[150px] whitespace-nowrap">关卡ID</th>

                        <th class="py-3 px-3 font-bold w-[110px] text-center whitespace-nowrap">游玩人数</th>
                        <th class="py-3 px-3 font-bold w-[60px] text-center whitespace-nowrap" title="标记是否已玩过">状态</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="text-sm"></tbody>
            </table>
        </div>

        <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center text-xs text-gray-400 dark:text-gray-500 transition-colors">
            <div>Generated by 
                <a href="https://github.com/luluxiaoyu/genshin-ugc-stage-tool" target="_blank" class="font-bold hover:text-blue-600 dark:hover:text-blue-400 hover:underline transition-colors">
                    Genshin UGC stage Tools
                </a>
            </div>
            <div class="text-right">
                数据来源：<a href="https://www.miyoushe.com/ys/" target="_blank" class="font-bold hover:text-blue-600 dark:hover:text-blue-400 transition-colors">miyoushe</a>
            </div>
        </div>
    </div>

    <div class="mt-8 flex justify-center gap-4 hidden" id="actionButtons">
        <button id="btnExportExcel" class="bg-green-600 hover:bg-green-700 dark:bg-green-700 dark:hover:bg-green-600 text-white font-bold py-2.5 px-6 rounded-full shadow-md transition-colors flex items-center gap-2">
            <i class="fa-solid fa-file-excel"></i> 导出 Excel
            <svg id="excelSpinner" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
        <button id="btnDownload" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-bold py-2.5 px-6 rounded-full shadow-md transition-colors flex items-center gap-2">
            <i class="fa-solid fa-image"></i> 保存高清长图
        </button>

</div>

<div id="saveManagerModal" class="fixed inset-0 z-50 hidden bg-gray-900/40 dark:bg-gray-900/80 backdrop-blur-sm flex items-center justify-center transition-opacity" aria-hidden="true">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden transform transition-all border dark:border-gray-700">
        <div class="flex justify-between items-center p-5 border-b border-gray-100 dark:border-gray-700">
            <h5 class="text-lg font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2 transition-colors"><i class="fa-solid fa-box-archive text-blue-500"></i> 存档管理</h5>
            <button onclick="toggleModal('saveManagerModal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors outline-none">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <div class="p-5 bg-gray-50 dark:bg-gray-900 transition-colors">
            <div class="flex justify-between mb-4">
                <button onclick="SaveManager.createNewProfile()" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-plus"></i> 新建存档
                </button>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('importFile').click()" class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-file-import"></i> 导入
                    </button>
                    <button onclick="SaveManager.exportData()" class="border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-file-export"></i> 备份
                    </button>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="SaveManager.importData(this)">
                </div>
            </div>
            <ul class="space-y-2 max-h-60 overflow-y-auto pr-1" id="profileList"></ul>
        </div>

<div id="copyToast" class="fixed bottom-6 right-6 z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
    <div class="bg-green-600 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3">
        <i class="fa-solid fa-check-circle"></i> 
        <span class="text-sm font-medium">ID 已复制到剪贴板</span>
    </div>
</div>

<script>
    window.toggleModal = (id) => {
        const modal = document.getElementById(id);
        modal.classList.toggle('hidden');
    };

    const showToast = () => {
        const toast = document.getElementById('copyToast');
        toast.classList.remove('opacity-0', 'translate-y-4');
        toast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'translate-y-4');
        }, 2000);
    };

    const SaveManager = {
        STORAGE_KEY: 'genshin_ugc_save_data_v1',
        data: {
            currentProfileId: 'default',
            profiles: {
                'default': { name: '默认存档', playedLevels: [] }
            }
        },

        init() {
            const stored = localStorage.getItem(this.STORAGE_KEY);
            if (stored) {
                try {
                    this.data = JSON.parse(stored);
                } catch (e) {
                    console.error('存档解析失败，重置为默认', e);
                }
            }
            this.updateUI();
            this.renderModalList();
        },

        save() {
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.data));
            this.updateUI();
        },

        updateUI() {
            const currentName = this.data.profiles[this.data.currentProfileId]?.name || '未知存档';
            document.getElementById('currentProfileDisplay').innerHTML = `<i class="fa-solid fa-folder-open"></i> ${currentName}`;
        },

        getPlayedStatus(levelId) {
            const list = this.data.profiles[this.data.currentProfileId].playedLevels || [];
            return list.includes(levelId.toString());
        },

        togglePlayed(levelId, isChecked) {
            const idStr = levelId.toString();
            const profile = this.data.profiles[this.data.currentProfileId];
            if (!profile.playedLevels) profile.playedLevels = [];

            if (isChecked) {
                if (!profile.playedLevels.includes(idStr)) profile.playedLevels.push(idStr);
            } else {
                profile.playedLevels = profile.playedLevels.filter(id => id !== idStr);
            }
            this.save();
        },

        createNewProfile() {
            const name = prompt("请输入新存档名称：");
            if (name) {
                const id = 'prof_' + Date.now();
                this.data.profiles[id] = { name: name, playedLevels: [] };
                this.switchProfile(id);
                this.renderModalList();
            }
        },

        switchProfile(id) {
            if (this.data.profiles[id]) {
                this.data.currentProfileId = id;
                this.save();
                this.renderModalList();
                sortAndRender(); 
            }
        },

        deleteProfile(id) {
            if (Object.keys(this.data.profiles).length <= 1) {
                alert("至少需要保留一个存档！");
                return;
            }
            if (confirm("确定要删除这个存档吗？此操作不可恢复。")) {
                delete this.data.profiles[id];
                if (this.data.currentProfileId === id) {
                    this.data.currentProfileId = Object.keys(this.data.profiles)[0];
                }
                this.save();
                this.renderModalList();
                sortAndRender();
            }
        },

        exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.data));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "genshin_stage_backup_" + Date.now() + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        },

        importData(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const json = JSON.parse(e.target.result);
                    if (json.profiles && json.currentProfileId) {
                        this.data = json;
                        this.save();
                        this.renderModalList();
                        sortAndRender();
                        alert("导入成功！");
                    } else {
                        alert("无效的存档文件格式");
                    }
                } catch (err) {
                    alert("文件解析失败");
                }
                input.value = ''; 
            };
            reader.readAsText(file);
        },

        renderModalList() {
            const listEl = document.getElementById('profileList');
            listEl.innerHTML = '';
            Object.keys(this.data.profiles).forEach(id => {
                const p = this.data.profiles[id];
                const isActive = id === this.data.currentProfileId;
                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-3 border rounded-xl bg-white dark:bg-gray-800 transition-colors ${isActive ? 'border-blue-500 shadow-sm' : 'border-gray-200 dark:border-gray-700'}`;
                li.innerHTML = `
                    <div class="cursor-pointer flex-grow flex items-center group" onclick="SaveManager.switchProfile('${id}')">
                        ${isActive ? '<i class="fa-solid fa-circle-check text-blue-600 dark:text-blue-400 mr-2.5 text-lg"></i>' : '<i class="fa-regular fa-circle text-gray-300 dark:text-gray-500 group-hover:text-blue-400 mr-2.5 text-lg transition-colors"></i>'}
                        <span class="font-bold text-gray-700 dark:text-gray-200">${p.name}</span>
                        <span class="bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 text-xs font-semibold px-2.5 py-0.5 rounded-full ml-2 transition-colors">${p.playedLevels?.length || 0}</span>
                    </div>
                    ${!isActive ? `<button class="text-red-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded-lg transition-colors ml-2 outline-none" onclick="SaveManager.deleteProfile('${id}')" title="删除"><i class="fa-solid fa-trash-can text-sm"></i></button>` : ''}
                `;
                listEl.appendChild(li);
            });
        }
    };

    const btnStart = document.getElementById('btnStart');
    const btnDownload = document.getElementById('btnDownload');
    const btnExportExcel = document.getElementById('btnExportExcel');
    const excelSpinner = document.getElementById('excelSpinner');
    const inputArea = document.getElementById('dataInput');
    const tableBody = document.getElementById('tableBody');
    const captureArea = document.getElementById('captureArea');
    const actionButtons = document.getElementById('actionButtons');
    const spinner = document.getElementById('spinner');
    const countBadge = document.getElementById('countBadge');
    const genTimeSpan = document.getElementById('genTime');
    const sortControl = document.getElementById('sortControl');
    const sortRadios = document.querySelectorAll('input[name="sortMode"]');
    const forceRefreshCheckbox = document.getElementById('forceRefresh');

    const LINE_REGEX = /^(\d+)(?:[:：].*)?$/;
    const CACHE_DURATION = 3 * 60 * 60 * 1000;

    let globalResults = [];

    SaveManager.init();

    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const idsParam = urlParams.get('ids');
        if (idsParam) {
            const ids = idsParam.split(',').join('\n');
            inputArea.value = ids;
            setTimeout(() => {
                if(inputArea.value.trim()) {
                    btnStart.click();
                }
            }, 200);
        }
    }

    const getProxyUrl = (url) => {
        if (!url) return 'https://via.placeholder.com/100x56?text=N/A';
        try {
            const base64 = btoa(url);
            return `/proxy-image/${encodeURIComponent(base64)}.png`;
        } catch (e) {
            console.error('Base64 encode failed', e);
            return 'https://via.placeholder.com/100x56?text=Err';
        }
    };

    const fetchImageAsBase64 = async (url) => {
        if (!url) return null;
        const proxyUrl = getProxyUrl(url);
        try {
            const response = await fetch(proxyUrl);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        } catch (e) {
            console.warn("Failed to fetch image for Excel:", url);
            return null;
        }
    };

    async function fetchWithRetry(id, maxRetries = 3, forceRefresh = false) {
        const cacheKey = `stage_data_${id}`;
        if (!forceRefresh) {
            const cachedStr = localStorage.getItem(cacheKey);
            if (cachedStr) {
                try {
                    const cachedObj = JSON.parse(cachedStr);
                    if (Date.now() - cachedObj.timestamp < CACHE_DURATION) {
                        return { isSuccess: true, data: cachedObj.data, id: id };
                    }
                } catch (e) { localStorage.removeItem(cacheKey); }
            }
        }

        let attempt = 0;
        let lastErrorMsg = 'Unknown';
        while (attempt <= maxRetries) {
            try {
                if (attempt > 0) await new Promise(r => setTimeout(r, 1500));
                const res = await fetch(`/guid?id=${id}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                if (json && json.success && json.data) {
                    try { localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: json.data })); } catch (e) {}
                    return { isSuccess: true, data: json.data, id: id };
                } else {
                    throw new Error(json.error || 'API Logic Error');
                }
            } catch (err) {
                console.warn(`ID ${id} attempt ${attempt + 1} failed:`, err.message);
                lastErrorMsg = err.message;
                attempt++;
            }
        }
        return { isSuccess: false, id: id, error: lastErrorMsg };
    }

    sortRadios.forEach(radio => {
        radio.addEventListener('change', () => sortAndRender());
    });

    function sortAndRender() {
        const sortMode = document.querySelector('input[name="sortMode"]:checked').value;
        const validData = globalResults.filter(item => item !== undefined && item !== null);

        if (validData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-400 dark:text-gray-500 transition-colors">无有效数据</td></tr>';
            return;
        }

        let sortedData = [...validData];
        if (sortMode === 'original') {
            sortedData.sort((a, b) => a.originalIndex - b.originalIndex);
        } else {
            sortedData.sort((a, b) => {
                if (a.isSuccess !== b.isSuccess) return a.isSuccess ? -1 : 1; 
                if (a.isSuccess) {
                    const d1 = a.data, d2 = b.data;
                    const min1 = d1.sortMin !== undefined ? d1.sortMin : 999;
                    const min2 = d2.sortMin !== undefined ? d2.sortMin : 999;
                    if (min1 !== min2) return min1 - min2;
                    return (d1.sortMax !== undefined ? d1.sortMax : 999) - (d2.sortMax !== undefined ? d2.sortMax : 999);
                }
                return 0;
            });
        }

        tableBody.innerHTML = '';
        sortedData.forEach(item => {
            if (item.isSuccess) renderRow(item.data);
            else renderErrorRow({ levelId: item.id, msg: `获取失败: ${item.error}` });
        });
    }

    btnStart.addEventListener('click', async () => {
        const text = inputArea.value.trim();
        const forceRefresh = forceRefreshCheckbox.checked; 
        if (!text) return alert('请输入内容');

        tableBody.innerHTML = ''; 
        globalResults = []; 
        captureArea.classList.remove('hidden');
        actionButtons.classList.add('hidden');
        sortControl.classList.add('hidden');
        
        btnStart.disabled = true;
        spinner.classList.remove('hidden');
        document.getElementById('sortOriginal').checked = true;

        genTimeSpan.innerText = new Date().toLocaleString('zh-CN', { hour12: false });

        const lines = text.split(/\n/).map(l => l.trim()).filter(l => l);
        
        const idsForUrl = [];
        lines.forEach(line => {
            const match = line.match(LINE_REGEX);
            if (match) idsForUrl.push(match[1]);
        });
        if (idsForUrl.length > 0) {
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('ids', idsForUrl.join(','));
            window.history.replaceState({}, '', newUrl);
        }

        let completedCount = 0;
        const promises = lines.map(async (line, index) => {
            const match = line.match(LINE_REGEX);
            if (!match) return null;
            const id = match[1];
            
            const result = await fetchWithRetry(id, 3, forceRefresh);
            const resultWithIndex = { ...result, originalIndex: index };
            globalResults.push(resultWithIndex);

            completedCount++;
            countBadge.innerText = `${completedCount} / ${lines.length}`;

            if (result.isSuccess) renderRow(result.data);
            else renderErrorRow({ levelId: result.id, msg: '获取失败' });

            return resultWithIndex;
        });

        const validPromises = promises.filter(p => p !== null);

        try {
            await Promise.all(validPromises);
            sortAndRender();
            countBadge.innerText = `${globalResults.length}`;
            actionButtons.classList.remove('hidden');
            sortControl.classList.remove('hidden');
        } catch (globalErr) {
            console.error('Critical Error:', globalErr);
            alert('程序发生严重错误');
        } finally {
            btnStart.disabled = false;
            spinner.classList.add('hidden');
        }
    });

    window.copyId = (id) => {
        navigator.clipboard.writeText(id).then(() => showToast()).catch(err => {
            console.error('Copy failed', err);
            alert('复制失败，请手动复制');
        });
    };

    window.toggleStatus = (checkbox, id) => {
        SaveManager.togglePlayed(id, checkbox.checked);
    };

    function renderRow(item) {
        if (!item) return;
        const tr = document.createElement('tr');
        // 加入深色模式下的 Hover 效果和边框
        tr.className = "border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50/50 dark:hover:bg-gray-700/50 transition-colors";
        
        const avatarUrl = getProxyUrl(item.authorAvatar);
        const coverUrl = getProxyUrl(item.coverUrl);

        const hotHtml = item.hotScore ? `<div class="flex items-center text-[13px] text-orange-500 mb-1"><i class="fa-solid fa-fire w-4 text-center mr-1"></i> ${item.hotScore}</div>` : '';
        const rateHtml = item.goodRate ? `<div class="flex items-center text-[13px] text-amber-500"><i class="fa-solid fa-thumbs-up w-4 text-center mr-1"></i> ${item.goodRate}</div>` : '';

        const isPlayed = SaveManager.getPlayedStatus(item.levelId);
        const checkedAttr = isPlayed ? 'checked' : '';

        tr.innerHTML = `
            <td class="p-3">
                <img src="${coverUrl}" class="w-24 h-[54px] rounded-md object-cover border border-gray-200 dark:border-gray-600 block shadow-sm transition-colors" alt="封面" crossorigin="anonymous">
            </td>
            <td class="p-3">
                <div class="flex items-center">
                    <img src="${avatarUrl}" class="w-9 h-9 rounded-full object-cover border border-gray-200 dark:border-gray-600 mr-2.5 shrink-0 transition-colors" alt="头像" crossorigin="anonymous">
                    <div class="font-bold text-xs text-gray-700 dark:text-gray-200 truncate max-w-[100px] transition-colors" title="${item.authorName || '未知'}">${item.authorName || '未知'}</div>
                </div>
            </td>
            <td class="p-3">
                <div class="text-[15px] font-bold text-gray-800 dark:text-gray-100 mb-1.5 leading-snug transition-colors">${item.levelName || '未知'}</div>
                <div class="block">
                    <span class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded text-[11px] font-medium mr-1 inline-block border border-blue-100/50 dark:border-blue-800/50 transition-colors">${item.type || '-'}</span>
                    <span class="bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 px-2 py-0.5 rounded text-[11px] font-medium inline-block border border-purple-100/50 dark:border-purple-800/50 transition-colors">${item.category || '-'}</span>
                </div>
            </td>
            <td class="p-3">
                <span class="font-mono text-gray-500 dark:text-gray-300 bg-gray-50/80 dark:bg-gray-700/80 px-2.5 py-1.5 rounded-lg text-[13px] border border-gray-200 dark:border-gray-600 flex items-center w-max shadow-sm transition-colors">
                    <i class="fa-solid fa-fingerprint text-gray-400 mr-1.5"></i>${item.levelId}
                    <i class="fa-regular fa-copy ml-2.5 cursor-pointer text-gray-400 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 hover:scale-110 transition-all" onclick="copyId('${item.levelId}')" title="复制ID"></i>
                </span>
            </td>
            <td class="p-3">
                <div class="flex flex-col">${hotHtml}${rateHtml}</div>
            </td>
            <td class="p-3 text-center">
                <span class="text-[13px] font-bold text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-900/30 px-3 py-1.5 rounded-full inline-block whitespace-nowrap border border-green-100/50 dark:border-green-800/50 transition-colors">
                    <i class="fa-solid fa-users mr-1"></i> ${item.playersStr || 'N/A'}
                </span>
            </td>
            <td class="p-3 text-center">
                <input type="checkbox" class="w-5 h-5 cursor-pointer accent-blue-600 dark:accent-blue-500 outline-none hover:scale-110 transition-transform" ${checkedAttr} onchange="toggleStatus(this, '${item.levelId}')">
            </td>
        `;
        tableBody.appendChild(tr);
    }

    function renderErrorRow(item) {
        const tr = document.createElement('tr');
        tr.className = 'bg-red-50/50 dark:bg-red-900/20 border-b border-red-100 dark:border-red-800/50 transition-colors';
        tr.innerHTML = `
            <td colspan="7" class="text-center py-5 text-red-500 dark:text-red-400 text-[13px] transition-colors">
                <i class="fa-solid fa-circle-exclamation mr-1.5"></i> 
                ID: <strong class="font-semibold text-red-600 dark:text-red-400">${item.levelId}</strong> - ${item.msg}
            </td>
        `;
        tableBody.appendChild(tr);
    }

    btnExportExcel.addEventListener('click', async () => {
        btnExportExcel.disabled = true;
        excelSpinner.classList.remove('hidden');

        try {
            const workbook = new ExcelJS.Workbook();
            workbook.creator = 'Genshin UGC Tool';
            workbook.created = new Date();
            
            const sheet = workbook.addWorksheet('关卡数据', { views: [{showGridLines: false}] });

            sheet.columns = [
                { header: '封面图', key: 'cover', width: 22 },
                { header: '序号', key: 'index', width: 6 },
                { header: '关卡ID', key: 'id', width: 15 },
                { header: '关卡名称', key: 'name', width: 25 },
                { header: '作者', key: 'author', width: 15 },
                { header: '类型', key: 'type', width: 12 },
                { header: '标签', key: 'cat', width: 12 },
                { header: '热度', key: 'hot', width: 10 },
                { header: '好评', key: 'rate', width: 10 },
                { header: '游玩人数', key: 'players', width: 12 },
                { header: '状态', key: 'status', width: 10 }
            ];

            const headerRow = sheet.getRow(1);
            headerRow.font = { name: '微软雅黑', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
            headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } }; 
            headerRow.alignment = { vertical: 'middle', horizontal: 'center' };
            headerRow.height = 30;

            const sortMode = document.querySelector('input[name="sortMode"]:checked').value;
            const validData = globalResults.filter(item => item !== undefined && item !== null && item.isSuccess);

            let sortedData = [...validData];
            if (sortMode === 'original') {
                sortedData.sort((a, b) => a.originalIndex - b.originalIndex);
            } else {
                sortedData.sort((a, b) => {
                    const d1 = a.data; const d2 = b.data;
                    const min1 = d1.sortMin || 999; const min2 = d2.sortMin || 999;
                    const max1 = d1.sortMax || 999; const max2 = d2.sortMax || 999;
                    if (min1 !== min2) return min1 - min2;
                    return max1 - max2;
                });
            }
            
            for (let i = 0; i < sortedData.length; i++) {
                const item = sortedData[i];
                const d = item.data;
                const isPlayed = SaveManager.getPlayedStatus(d.levelId);
                
                const row = sheet.addRow({
                    cover: '',
                    index: i + 1,
                    id: d.levelId,
                    name: d.levelName || '未知',
                    author: d.authorName || '未知',
                    type: d.type || '-',
                    cat: d.category || '-',
                    hot: d.hotScore || '',
                    rate: d.goodRate || '',
                    players: d.playersStr || '',
                    status: isPlayed ? '★ 已玩' : '未玩'
                });

                row.height = 60;
                row.alignment = { vertical: 'middle', horizontal: 'center' };
                
                row.eachCell({ includeEmpty: true }, (cell) => {
                    cell.border = {
                        top: { style: 'thin', color: { argb: 'FFEEEEEE' } },
                        left: { style: 'thin', color: { argb: 'FFEEEEEE' } },
                        bottom: { style: 'thin', color: { argb: 'FFEEEEEE' } },
                        right: { style: 'thin', color: { argb: 'FFEEEEEE' } }
                    };
                });

                row.getCell('id').font = { name: 'Consolas', bold: true, size: 11 };
                row.getCell('name').font = { name: '微软雅黑', bold: true, size: 11 };

                const statusCell = row.getCell('status');
                if (isPlayed) {
                    statusCell.font = { color: { argb: 'FF15803D' }, bold: true }; 
                } else {
                    statusCell.font = { color: { argb: 'FF9CA3AF' } }; 
                }

                if (d.coverUrl) {
                    const base64 = await fetchImageAsBase64(d.coverUrl);
                    if (base64) {
                        const imageId = workbook.addImage({ base64: base64, extension: 'png' });
                        sheet.addImage(imageId, {
                            tl: { col: 0.1, row: i + 1 + 0.1 },
                            ext: { width: 128, height: 72 },
                            editAs: 'oneCell'
                        });
                    }
                }
            }

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            saveAs(blob, `千星奇域_详细关卡数据_${new Date().toISOString().slice(0,10)}.xlsx`);
        } catch (e) {
            console.error(e);
            alert("导出 Excel 失败，请检查网络或重试。");
        } finally {
            btnExportExcel.disabled = false;
            excelSpinner.classList.add('hidden');
        }
    });

    // 智能深色模式识别的长图生成逻辑
    btnDownload.addEventListener('click', () => {
        genTimeSpan.innerText = new Date().toLocaleString('zh-CN', { hour12: false });
        window.scrollTo(0,0);

        // 临时移除阴影防止截图白边/黑边
        captureArea.classList.remove('shadow-[0_4px_12px_rgba(0,0,0,0.05)]', 'dark:shadow-[0_4px_12px_rgba(0,0,0,0.3)]');
        
        // 自动识别当前的系统主题模式决定背景色 (深色用 gray-800 的十六进制色)
        const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const targetBgColor = isDarkMode ? '#1f2937' : '#ffffff';

        html2canvas(captureArea, {
            scale: 2, 
            backgroundColor: targetBgColor, // 动态背景色
            useCORS: true, 
            allowTaint: true,
            logging: false,
            scrollY: -window.scrollY
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `千星奇域数据_${new Date().getTime()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            // 恢复阴影
            captureArea.classList.add('shadow-[0_4px_12px_rgba(0,0,0,0.05)]', 'dark:shadow-[0_4px_12px_rgba(0,0,0,0.3)]');
        }).catch(err => {
            alert('生成失败');
            console.error(err);
        });
    });

    window.onload = checkUrlParams;
</script>
</body>
</html>
